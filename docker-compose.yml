services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPABASE_DB_NAME:-medicalcamp}
      POSTGRES_USER: ${SUPABASE_DB_USER:-campuser}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-changeme}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./data/media:/app/media      # local disk storage (scans + voicebot audio)
    expose:
      - "8000"

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/media:/media:ro       # serve /media/ directly
      - caddy_data:/data             # persists TLS certs (avoid LE rate limits)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
