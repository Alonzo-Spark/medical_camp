# Nginx site config for the Medical Camp app.
# Serves the React build at / and proxies backend paths to gunicorn.
# Copy to /etc/nginx/sites-available/medicalcamp and symlink into sites-enabled.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Allow large report photo uploads (no 4.5 MB serverless limit here).
    client_max_body_size 25M;

    # ---- React frontend (built static files) ----
    root /opt/medical_camp/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing
    }

    # ---- Django static & media (served directly by nginx) ----
    location /static/ {
        alias /opt/medical_camp/staticfiles/;
        access_log off;
        expires 30d;
    }
    location /media/ {
        alias /opt/medical_camp/media/;
        access_log off;
        expires 7d;
    }

    # ---- Backend routes → gunicorn ----
    location /api/      { include /etc/nginx/proxy_params; proxy_pass http://unix:/run/medicalcamp.sock; }
    location /admin/    { include /etc/nginx/proxy_params; proxy_pass http://unix:/run/medicalcamp.sock; }
    location /export    { include /etc/nginx/proxy_params; proxy_pass http://unix:/run/medicalcamp.sock; }
    location /legacy/   { include /etc/nginx/proxy_params; proxy_pass http://unix:/run/medicalcamp.sock; }
}
