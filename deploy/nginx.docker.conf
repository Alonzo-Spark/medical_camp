server {
    listen 80;
    server_name _;

    # Allow large report photo uploads.
    client_max_body_size 25M;

    # Forward real client info to Django (used for absolute URLs / CSRF).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # React build
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded media (scan images, voicebot audio) from the shared volume
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # Backend routes → gunicorn (the "backend" compose service)
    location /static/ { proxy_pass http://backend:8000; }
    location /api/    { proxy_pass http://backend:8000; }
    location /admin/  { proxy_pass http://backend:8000; }
    location /export  { proxy_pass http://backend:8000; }
    location /legacy/ { proxy_pass http://backend:8000; }

    # SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
